<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>좌석 배치 · 관리자</title><link rel="stylesheet" href="style.css"></head><body data-mode="admin"><main class="wrap"><header><div><h1>좌석 관리</h1><p>이름 수정과 좌석 위치 변경이 다른 기기에도 실시간 반영됩니다.</p></div><span id="status">연결 중…</span></header><section class="panel"><div class="editor" id="editor"><h2>편집 기능</h2><button type="button" data-mode="normal" class="on">이름 수정</button><button type="button" data-mode="move">좌석 이동</button><button type="button" data-mode="add">새 좌석 추가</button><button type="button" id="pushThird" class="warn">3열부터 뒤로 한 줄 밀기</button><button type="button" id="pullThird">밀린 3열 원위치</button><button type="button" id="undo">직전 배치 되돌리기</button><span id="selected" class="selected-note">선택된 좌석 없음</span></div><p id="message" class="hint">좌석을 눌러 관객 이름을 수정하세요.</p><div class="stage">무대</div><div class="grid" id="grid"></div><p id="stats"></p><div class="actions"><button type="button" id="export">명단 CSV 저장</button><a href="index.html">관객 화면</a></div><p class="hint">통로에는 좌석을 배치할 수 없습니다. 배치를 바꾸어도 기존 좌석 번호와 관객 이름은 유지됩니다.</p></section></main><dialog class="dialog" id="dialog"><h2 id="seatTitle"></h2><label>관객 이름<input id="guest" maxlength="40" autocomplete="off" placeholder="이름을 입력하세요"></label><div class="actions"><button class="primary" id="save" type="button">저장</button><button id="remove" type="button">이름 지우기</button><button id="cancel" type="button">닫기</button></div><p id="saveMessage"></p></dialog><script type="module" src="./app.js"></script></body></html>
